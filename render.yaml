# Render service definition (Infrastructure-as-Code)
# Docs: https://render.com/docs/blueprint-spec
#
# Usage:
#   1. Push this file to main branch (already done)
#   2. Render dashboard → New → Blueprint → connect repo → select this file
#   3. Render reads this config and provisions the web service
#   4. Subsequent main pushes auto-deploy via Render's GitHub webhook (no CI job needed)
#
# Free tier caveats:
#   - 15 min idle → sleep, cold start 30–60s on first request
#   - 1GB persistent disk (mounted at /app/data) for SQLite + uploads
#   - 512MB RAM, 0.1 CPU

services:
  - type: web
    name: group-chat-digest
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: mock
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8000"
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
