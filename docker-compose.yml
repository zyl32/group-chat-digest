services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - LLM_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      # Use the stdlib (no curl install needed in python:3.12-slim).
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
