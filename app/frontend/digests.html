<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>摘要列表 — Group Chat Digest</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header>
    <h1>Digest 摘要列表</h1>
    <nav>
      <a href="/">上传</a> |
      <a href="/setup.html">设置 API Key</a> |
      <a href="/todos.html">待办</a>
    </nav>
  </header>
  <main>
    <section>
      <p id="loading" class="muted">加载中...</p>
      <table id="digest-table" style="display:none; width:100%; border-collapse:collapse;">
        <thead>
          <tr>
            <th style="text-align:left; padding:0.4rem;">ID</th>
            <th style="text-align:left; padding:0.4rem;">日期</th>
            <th style="text-align:left; padding:0.4rem;">窗口</th>
            <th style="text-align:left; padding:0.4rem;">模型</th>
            <th style="text-align:left; padding:0.4rem;">块数</th>
            <th style="text-align:left; padding:0.4rem;">upload_id</th>
            <th style="text-align:left; padding:0.4rem;">操作</th>
          </tr>
        </thead>
        <tbody id="digest-rows"></tbody>
      </table>
    </section>
  </main>
  <script>
    (function () {
      var loadingEl = document.getElementById('loading');
      var tableEl = document.getElementById('digest-table');
      var rowsEl = document.getElementById('digest-rows');
      function shortId(s) { return s ? s.slice(0, 8) + '…' : ''; }
      fetch('/api/digests').then(function (r) {
        if (!r.ok) { loadingEl.textContent = '加载失败: ' + r.status; return; }
        return r.json();
      }).then(function (rows) {
        if (!rows) return;
        if (!rows.length) { loadingEl.textContent = '暂无摘要，先上传群聊导出再触发处理。'; return; }
        loadingEl.style.display = 'none';
        tableEl.style.display = 'table';
        rows.forEach(function (d) {
          var tr = document.createElement('tr');
          [
            d.id, d.date, d.window, d.model_used,
            (d.summary_blocks || []).length, shortId(d.upload_id)
          ].forEach(function (cell) {
            var td = document.createElement('td');
            td.style.padding = '0.4rem';
            td.style.borderTop = '1px solid #eee';
            td.textContent = cell;
            tr.appendChild(td);
          });
          var td = document.createElement('td');
          td.style.padding = '0.4rem';
          td.style.borderTop = '1px solid #eee';
          var a = document.createElement('a');
          a.href = '/digest_detail.html?upload_id=' + encodeURIComponent(d.upload_id);
          a.textContent = '查看';
          td.appendChild(a);
          tr.appendChild(td);
          rowsEl.appendChild(tr);
        });
      }).catch(function (err) {
        loadingEl.textContent = '网络错误: ' + err.message;
      });
    })();
  </script>
</body>
</html>
