<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>群聊摘要与待办提取器</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header>
    <h1>Group Chat Digest</h1>
    <nav>
      <a href="/setup.html">设置 API Key</a> |
      <a href="/todos.html">待办</a> |
      <a href="/digests.html">摘要</a>
    </nav>
  </header>
  <main>
    <section id="upload">
      <h2>上传群聊导出</h2>
      <p class="muted">支持微信 JSON、飞书 JSON 和纯文本格式。上传后后端会同步解析并提取摘要与待办。</p>
      <form id="upload-form" enctype="multipart/form-data">
        <label for="file">选择文件</label>
        <input type="file" name="file" id="file" accept=".json,.txt" required>

        <label for="fmt">导出格式</label>
        <select name="fmt" id="fmt">
          <option value="wechat">微信 JSON</option>
          <option value="feishu">飞书 JSON</option>
          <option value="plain">纯文本</option>
        </select>

        <button type="submit">上传</button>
      </form>
      <div id="upload-status" class="status" role="status" aria-live="polite"></div>
    </section>
    <section>
      <h2>下一步</h2>
      <p>上传后系统会自动跑 LLM 生成摘要与待办。前往 <a href="/todos.html">待办列表</a> 查看与导出，或去 <a href="/digests.html">摘要列表</a> 查看摘要。</p>
      <p>首次使用需先 <a href="/setup.html">配置 LLM API Key</a>。</p>
    </section>
  </main>
  <script>
    (function () {
      var form = document.getElementById('upload-form');
      var status = document.getElementById('upload-status');
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        var fd = new FormData(form);
        status.textContent = '上传中...';
        status.className = 'status';
        try {
          var r = await fetch('/api/uploads', { method: 'POST', body: fd });
          var text = await r.text();
          if (!r.ok) {
            status.textContent = '上传失败: ' + r.status + ' ' + text;
            status.className = 'status err';
            return;
          }
          var j = JSON.parse(text);
          status.textContent = '上传成功 (upload_id=' + j.upload_id + '), 正在触发摘要...';
          status.className = 'status';
          // Auto-trigger process: upload alone does not generate a digest;
          // POST /api/uploads/{id}/process runs the LLM + extracts todos.
          var pr = await fetch('/api/uploads/' + encodeURIComponent(j.upload_id) + '/process', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({})
          });
          var pt = await pr.text();
          if (!pr.ok) {
            status.textContent = '摘要触发失败: ' + pr.status + ' ' + pt;
            status.className = 'status err';
            return;
          }
          var pj = JSON.parse(pt);
          status.replaceChildren(
            document.createTextNode('摘要生成完成: digest_id=' + pj.digest_id
              + ', todo_count=' + pj.todo_count + ' '),
            Object.assign(document.createElement('a'), {
              href: '/digest_detail.html?upload_id=' + encodeURIComponent(j.upload_id),
              textContent: '查看摘要'
            }),
            document.createTextNode(' | '),
            Object.assign(document.createElement('a'), {
              href: '/todos.html',
              textContent: '查看待办'
            })
          );
          status.className = 'status ok';
        } catch (err) {
          status.textContent = '网络错误: ' + err.message;
          status.className = 'status err';
        }
      });
    })();
  </script>
</body>
</html>
