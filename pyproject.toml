[project]
name = "group-chat-digest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "keyring>=24",
    "openai>=1.30",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "ics>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
dev-dependencies = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-asyncio>=0.23", "respx>=0.21"]
